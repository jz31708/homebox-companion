name: Apply shared capture integration

on:
  push:
    branches:
      - fix/final-apartment-ingestion-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-shared-capture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-apartment-ingestion-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply bounded integration patch
        run: python scripts/apply_shared_capture_integration.py
      - name: Install and format
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/lib/types/index.ts src/lib/workflows/bulkSweepBase.svelte.ts src/routes/bulk-capture/+page.svelte src/lib/components/BulkContinuousCapture.svelte src/lib/services/bulkAnalysisPlanner.ts src/lib/shared/ingestionCaptureCore.ts
      - name: Validate frontend before commit
        working-directory: frontend
        run: |
          npm run check
          npm run lint
          npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/types/index.ts frontend/src/lib/workflows/bulkSweepBase.svelte.ts frontend/src/routes/bulk-capture/+page.svelte frontend/src/lib/components/BulkContinuousCapture.svelte frontend/src/lib/services/bulkAnalysisPlanner.ts frontend/src/lib/shared/ingestionCaptureCore.ts
          git commit -m "feat: unify rapid camera and narration capture"
          git push origin HEAD:fix/final-apartment-ingestion-audit
