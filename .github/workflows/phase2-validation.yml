name: Phase 2 validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync backend dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check src server tests
      - name: Focused narration backend tests
        run: uv run pytest tests/test_audio_transcription.py tests/test_transcription_provider.py -q
      - name: Complete backend tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Svelte and TypeScript check
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Auth bootstrap gate
        run: npx playwright test e2e/auth-bootstrap.spec.ts --config=playwright.config.ts --workers=1
      - name: Phase 1 persistence gate
        run: npx playwright test e2e/phase1-persistence-regressions.spec.ts --config=playwright.config.ts --workers=1
      - name: Phase 2 narration gate
        run: npx playwright test e2e/phase2-narration.spec.ts --config=playwright.config.ts --workers=1
      - name: Complete managed E2E suite
        run: npm run e2e:managed:serial
