name: Apply durable discard correction

on:
  push:
    branches:
      - fix/final-apartment-ingestion-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[discard-tombstone-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-apartment-ingestion-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply durable discard correction
        run: python scripts/apply_discard_tombstone_fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format corrected files
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/lib/services/bulkMissionDb.ts src/lib/workflows/bulkSweepBase.svelte.ts
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/services/bulkMissionDb.ts frontend/src/lib/workflows/bulkSweepBase.svelte.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: prevent discarded missions from resurrection [discard-tombstone-fixed]"
          git push origin HEAD:fix/final-apartment-ingestion-audit
